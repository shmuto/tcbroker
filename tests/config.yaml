rules:
  # Mirror UDP packets from client to server (with MAC rewrite) and to mirror target
  - name: client-to-server-rewrite
    src: broker2client
    dst:
      - intf: broker2server
        rewrite:
          dst_mac: "00:00:00:00:20:02"
    filters:
      - proto: udp

  - name: client-to-mirror
    src: broker2client
    dst: broker2mirror
    filters:
      - proto: udp
        src_ip: 192.168.10.0/24

  # Mirror UDP packets from server to monitoring interface (without rewrite)
  - name: server-to-mirror
    src: broker2server
    dst: broker2mirror
    filters:
      - proto: udp
