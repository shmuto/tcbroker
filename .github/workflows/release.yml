name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 2.0.0). Leave empty to use VERSION file.'
        required: false
        type: string
      prerelease:
        description: 'Mark GitHub Release as pre-release (skips updating :latest Docker tag)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  prepare:
    name: Prepare Release Metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      major_minor: ${{ steps.meta.outputs.major_minor }}
      major: ${{ steps.meta.outputs.major }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and create tag if needed
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            VER="${TAG#v}"
          else
            RAW="${INPUT_VERSION:-$(tr -d '[:space:]' < VERSION)}"
            VER="${RAW#v}"
            TAG="v${VER}"
          fi

          if ! echo "${VER}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid semver version: ${VER} (expected X.Y.Z or X.Y.Z-rc.1)"
            exit 1
          fi

          BASE_VER="${VER%%-*}"
          MAJOR="$(echo "${BASE_VER}" | cut -d. -f1)"
          MINOR="$(echo "${BASE_VER}" | cut -d. -f2)"

          IS_PRE="false"
          if [ "${INPUT_PRERELEASE}" = "true" ] || echo "${VER}" | grep -q '-'; then
            IS_PRE="true"
          fi

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            if git rev-parse "${TAG}" >/dev/null 2>&1; then
              echo "Tag ${TAG} already exists; reusing existing tag."
            else
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -a "${TAG}" -m "Release ${TAG}"
              git push origin "${TAG}"
              echo "Created and pushed tag ${TAG}"
            fi
          fi

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VER}" >> "${GITHUB_OUTPUT}"
          echo "major_minor=${MAJOR}.${MINOR}" >> "${GITHUB_OUTPUT}"
          echo "major=${MAJOR}" >> "${GITHUB_OUTPUT}"
          echo "is_prerelease=${IS_PRE}" >> "${GITHUB_OUTPUT}"

  verify:
    name: Verify Tests & Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.9'

      - name: Run go vet and unit tests
        run: |
          go vet ./...
          go test -race -count=1 ./...

  release-binaries:
    name: Build Binaries & Publish GitHub Release
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.9'

      - name: Build release archives and checksums
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p dist
          for GOARCH in amd64 arm64; do
            STAGE="dist/stage-${GOARCH}"
            mkdir -p "${STAGE}"
            CGO_ENABLED=0 GOOS=linux GOARCH="${GOARCH}" \
              go build -buildvcs=false -trimpath \
              -ldflags="-w -s -X main.version=${VERSION}" \
              -o "${STAGE}/tcbroker" ./cmd/tcbroker
            cp LICENSE README.md "${STAGE}/"
            tar -C "${STAGE}" -czf "dist/tcbroker_${VERSION}_linux_${GOARCH}.tar.gz" tcbroker LICENSE README.md
            rm -rf "${STAGE}"
          done
          (cd dist && sha256sum tcbroker_*.tar.gz > checksums.txt)
          ls -lh dist/
          cat dist/checksums.txt

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' }}
          files: |
            dist/tcbroker_*.tar.gz
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-docker:
    name: Build & Push Multi-Arch Docker Image (GHCR)
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=${{ needs.prepare.outputs.major_minor }},enable=${{ needs.prepare.outputs.is_prerelease != 'true' }}
            type=raw,value=${{ needs.prepare.outputs.major }},enable=${{ needs.prepare.outputs.is_prerelease != 'true' }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.is_prerelease != 'true' }}
            type=sha

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
